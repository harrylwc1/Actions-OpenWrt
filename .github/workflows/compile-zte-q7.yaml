name: build ramips zte q7 and y1 

on:

  workflow_dispatch:

    inputs:

      ssh:

        description: 'SSH connection to Actions'

        required: false

        default: 'false'
  #schedule:
    #- cron: "45 15 * * *"

env:
  CONFIG_FILENAME_FOR_2ND_COMPILE: config.ramips.2.x-wrt
  #config.ramips.2.kernel5.15
  #config.ramips.2.x-wrt
  #####change model here ####@#
  REPO_URL: https://github.com/x-wrt/x-wrt
  #https://github.com/openwrt/openwrt.git
  REPO_URL1: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: 'master'
  ROUTER_MODEL: ramips
  TVH: false
  BUILD_KERNEL_MODULES: true
  DRIVERS_DIR: x-wrt/bin/targets/ramips/drivers
  KERNEL_CONFIG: 'myconfig/kernel_config.ramips'
  #KERNEL_CONFIG_DIR: target/linux/ipq40xx
  KERNEL_CONFIG_DIR: x-wrt/target/linux/ramips/mt7620
  #KERNEL_CONFIG_DIR: target/linux/ramips/mt7621
  #KERNEL_CONFIG_DIR: target/linux/mvebu
  MAKEMENU_CONFIG: false
  KERNEL_MENUCONFIG: false
  CPU_MULTI_CORE: false

  KERNEL_VERSION: '6.18'
  UPDATE_MULTI_CORE_FILE1: myconfig/sys.lua
  UPDATE_MULTI_CORE_FILE2: myconfig/processes.js
  KERNEL_MODULE: myconfig/kernel_modules.txt
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  SSH_ACTIONS: true
  UPLOAD_FIRMWARE: true
  #UPLOAD_ROUTER: false
  TZ: Asia/Shanghai
  target_device_arch_1: ramips
  CLEARCACHE: true

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

    - name: 检查项目分支

      uses: actions/checkout@main
    - name: Check CPU model
      run: |
          cat /proc/cpuinfo|grep model
          cat /proc/cpuinfo|grep proce
          free
    - name: 更改设置

      run: |
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          #sed -i 's/github.com\/x-wrt\/x-wrt/git.openwrt.org\/openwrt\/openwrt.git x-wrt/g' $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH
          sudo timedatectl set-timezone "$TZ"


    - name: 安装编译环境

      env:

        DEBIAN_FRONTEND: noninteractive

      run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-get -y rsync rclone purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* || true
          sudo -E apt-get update
          sudo -E apt-get -y install opencc ccache build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libfuse-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5
          #sudo -E apt-get update
          #sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libfuse-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5 --fix-missing
          sudo -E apt-get -y purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* || true
          sudo -E apt-get update
          sudo -E apt-get -y autoremove --purge
          #sudo pip install ply
          #sudo -E python3 -m pip install --upgrade pip
          #sudo -E pip install --no-cache-dir --trusted-host pypi.org --trusted-host pypi.python.org --trusted-host files.pythonhosted.org pip setuptools
          sudo -E apt-get clean
          #sudo rm -f /swapfile
          sudo rm -f /usr/local/share/chromium/chrome-linux/chrome
          sudo rm -f /opt/microsoft/msedge/msedge
          sudo rm -f $GITHUB_WORKSPACE/lede/.git/objects/pack/pack-*.pack
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          pip install asciidoc


    - name: 查看磁盘

      run: df -hT


    - name: 清理空间

      run: |
        sudo swapoff -a
        #sudo rm -f /swapfile
        sudo apt clean
        #docker rmi $(docker image ls -aq)
    
    - name: SSH链接管理
      uses: owenthereal/action-upterm@v1
      #uses: P3TERX/ssh2actions@main

      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:                                    
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    

    - name: Generate cache mixkey
      id: gen_cache_mixkey
      working-directory: ${{ env.WORKING_DIR }}
      run: |
          #target_device_arch_1="mvebu_ipq40xx_ramips"
          target_device_arch_1="ramips"
          gcc_hash=$(gcc --version | sha256sum | awk '{print substr($1,1,8)}')
          #gcc_hash='37dab1b7'
          ldd_hash=$(ldd --version | sha256sum | awk '{print substr($1,1,8)}')
          mixkey1="${target_device_arch_1}-${gcc_hash}-${ldd_hash}"
          #mixkey2="${target_device_arch_2}-${gcc_hash}-${ldd_hash}"
          echo "mixkey1=$mixkey1" >> $GITHUB_OUTPUT

    - name: Cache1
      uses: HiGarfield/cachewrtbuild@main                               #klever1988/cachewrtbuild@main
      with:
          ccache: 'true'
          mixkey: ${{ steps.gen_cache_mixkey.outputs.mixkey1 }}
          #prefix: ${{ env.WORKING_DIR }}
          prefix: ${{ github.workspace }}/x-wrt
          #skip_saving: 'true'
    - name: Clear Cache
      if: env.CLEARCACHE == 'true'
      run: |
          gh extension install actions/gh-actions-cache
          REPO=${{ github.repository }}
          BRANCH="master"
          #target_device_arch_1="ipq40xx"
          #echo "Fetching list of cache key"
          list_of_caches=$(gh actions-cache  --sort created-at list -R $REPO -B $BRANCH -L 100| cut -f 1)
          echo $list_of_caches
          no_of_cache=$(gh actions-cache list -R $REPO -B $BRANCH -L 100|wc -l)
          echo no of cache found = $no_of_cache
          if [ "$no_of_cache" -gt 6 ]
          then
          cacheKey=$(gh actions-cache  --sort created-at list -R $REPO -B $BRANCH -L 100| cut -f 1|tail -1 )
          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          gh actions-cache delete $cacheKey -R $REPO -B $BRANCH --confirm
          echo $cacheKey
          echo "Done"
          fi
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            
    - name: 下载安装包

      id: package

      run: |

        cd x-wrt

        make defconfig

        make download -j8

        find dl -size -1024c -exec ls -l {} \;

        find dl -size -1024c -exec rm -f {} \;
    - name: Install SSH Key for Router
      run: |
          mkdir -p $GITHUB_WORKSPACE/x-wrt/tmp_upload
          mkdir -p ~/.ssh
          # 從 GitHub Secrets 讀入私鑰並寫入檔案
          echo "${{ secrets.ROUTER_SSH_KEY }}" > ~/.ssh/router_key
          chmod 600 ~/.ssh/router_key
          
          # 掃描並信任遠端路由器的主機指紋 ，防止 SSH 互動式確認卡死
          ssh-keyscan -p ${{ secrets.ROUTER_PORT }} ${{ secrets.SERVER1 }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/router_key -p ${{ secrets.ROUTER_PORT }} root@${{ secrets.SERVER1 }} "echo '連線測試成功！'"
 
    - name: 开始编译固件
      run: |
          #cp myconfig/config.newifi-d2.0 x-wrt/.config
          cd x-wrt
          ls -alt $GITHUB_WORKSPACE/x-wrt/.config
          echo cpu core=$(nproc)
          #make -j$(nproc)
          #[ $? != 0 ] && make V=s || echo "build success"
          

          #     echo "======================="
          #echo "Space usage:"
          #echo "======================="
          df -kh
          #echo "======================="
    -  name: SSH connection for failure Debug
       if: ${{ failure() }}
       uses: owenthereal/action-upterm@v1
        #uses: P3TERX/ssh2actions@main
         #uses: lhotari/action-upterm@v1
         #uses: P3TERX/ssh2actions@main
       env:                                    
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    


    - name: SSH connection for KERNEL MENU CONFIG
      if: env.KERNEL_MENUCONFIG == 'true'
      uses: lhotari/action-upterm@v1
      

    - name: 再次编译固件 update kernel_menuconfig
      if: env.BUILD_KERNEL_MODULES == 'true'
      run: |
           #cp -f $GITHUB_WORKSPACE/x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox $DRIVERS_DIR
           cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config

           #cp $GITHUB_WORKSPACE/myconfig/config.ramips.2 $GITHUB_WORKSPACE/x-wrt/.config
           #cp $GITHUB_WORKSPACE/patches/600-custom-change-txpower-and-dfs.patch  $GITHUB_WORKSPACE/x-wrt/package/firmware/wireless-regdb/patches/
           #cat myconfig/config.tvh.ffmpeg >> .config
           #[ -e $KERNEL_MODULE ] && cat $KERNEL_MODULE >> $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           [ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           #[ -e $KERNEL_MODULE ] && cat $KERNEL_MODULE >> $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           cd x-wrt
           ls -alt $GITHUB_WORKSPACE/x-wrt/.config
           echo cpu core=$(nproc)
           make -j$(nproc) #| tee makelog.txt
           #curl -i -X POST http://r619ac.ddnsfree.com:8080/store.json --data-binary "@makelog.txt"
           #|| make -j1 V=s
           [ $? != 0 ] && make V=s || echo "build success"
           #cp $GITHUB_WORKSPACE/myconfig/config.ramips.3 $GITHUB_WORKSPACE/x-wrt/.config
           #cp -f $GITHUB_WORKSPACE/x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox $DRIVERS_DIR
           #make -j$(nproc) || make -j1 V=s
           #[ $? != 0 ] && make V=s || echo "build success"

           cp -f bin/targets/ramips/mt7620/openwrt-ramips-mt7620*sysupgrade.bin bin/targets/ramips/drivers/


    - name: SSH connection for failure Debug
      if: ${{ failure() }}
      #uses: lhotari/action-upterm@v1
      #uses: P3TERX/ssh2actions@main
      uses: owenthereal/action-upterm@v1
    - name: 查看磁盘使用情况

      if: (!cancelled())

      run: df -hT
    - name: Prepare artifact
      run: |
        # 1. 確保資料夾存在（如果變數沒設定，預設建立在當前目錄的 drivers）
        : "${DRIVERS_DIR:=./drivers}"
        mkdir -p "$DRIVERS_DIR"
        
        # 2. 安全地尋找並複製驅動程式
        echo "=== 正在尋找 .ko 檔案 ==="
        KO_FILES=$(find x-wrt/build_dir/target*mipsel*/linux*/linux-*/ -name "*.ko" | grep -v oot || true)
        if [ -n "$KO_FILES" ]; then
          cp $KO_FILES "$DRIVERS_DIR/"
          echo "成功複製驅動程式。"
        else
          echo "警告：找不到任何 .ko 驅動程式檔案。"
        fi

        # 3. 獲取韌體編譯版本號
        echo "=== 正在獲取 BUILD_VERSION ==="
        VERSION_FILE=$(find x-wrt/bin/targets/ -name version.buildinfo | head -1 || true)
        if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
          head -1 "$VERSION_FILE" > BUILD_VERSION
          echo "BUILD_VERSION=_$(cat BUILD_VERSION)" >> $GITHUB_ENV
        else
          echo "找不到 version.buildinfo，跳過設定。"
        fi

        # 4. 獲取裝置型號名稱
        echo "=== 正在獲取 DEVICE_NAME ==="
        if [ -f x-wrt/.config ]; then
          grep '^CONFIG_TARGET.*DEVICE.*=y' x-wrt/.config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          if [ -s DEVICE_NAME ]; then
            echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          fi
        else
          echo "找不到 .config 檔案，跳過設定。"
        fi

        # 5. 記錄編譯時間
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        # 6. 獲取 Linux 核心版本號
        echo "=== 正在獲取 KERNEL_VER ==="
        KMOD_FILE=$(find x-wrt/bin/targets -name "*kmod*" | tail -1 || true)
        if [ -n "$KMOD_FILE" ]; then
          echo "$KMOD_FILE" | cut -d _ -f2 | cut -d - -f1 > KRNEL_VER
          if [ -s KRNEL_VER ]; then
            echo "KERNEL_VER=_$(cat KRNEL_VER)" >> $GITHUB_ENV
          fi
        else
          echo "找不到包含 kmod 的檔案，跳過設定。"
        fi
        
        echo "=== 準備程序結束 ==="

      
    - name: zip bin directory
      run: |
          cd x-wrt
          zip -r OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip bin
    - name: Upload firmware via rclone (Multi-threaded)
      env:
        # 透過環境變數直接注入 rclone SFTP 設定
        RCLONE_CONFIG_MYROUTER_TYPE: sftp
        RCLONE_CONFIG_MYROUTER_HOST: ${{ secrets.SERVER1 }}
        RCLONE_CONFIG_MYROUTER_PORT: ${{ secrets.ROUTER_PORT }}
        RCLONE_CONFIG_MYROUTER_USER: root
        RCLONE_CONFIG_MYROUTER_KEY_FILE: ~/.ssh/router_key
        
        # 💥 核心修正 1：修正拼字錯誤，並將舊版 Dropbear 所需的 SSH 參數注入 rclone
        RCLONE_SFTP_SSH_OPTION: "StrictHostKeyChecking=no,PubkeyAcceptedKeyTypes=+ssh-rsa,HostKeyAlgorithms=+ssh-rsa"
        
        # 💥 核心修正 2：核心關鍵！劫持 SFTP 子系統，強制讓 rclone 透過純 SSH 調用路由器的 scp 服務
        RCLONE_CONFIG_MYROUTER_SERVER_COMMAND: "scp -t /"
      run: |
        # 建立臨時目錄並複製檔案
        mkdir -p $GITHUB_WORKSPACE/x-wrt/tmp_upload/
        cp x-wrt/OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip $GITHUB_WORKSPACE/x-wrt/tmp_upload/
        
        # 1. 在 GitHub Actions 虛擬主機中安裝 rclone
        echo "====== 正在安裝 rclone ======"
        curl https://rclone.org/install.sh | sudo bash
        
        # 2. 建立並執行上傳腳本
        cat << 'EOF' > upload_to_router.sh
        #!/bin/sh
        echo "====== 開始將 $GITHUB_WORKSPACE/x-wrt/tmp_upload/ 傳輸至 OpenWrt 路由器 ====="
        
        # 使用 rclone copy 並加上多線程與相容性優化參數
        # --sftp-disable-hashcheck : 必須保留，純 SSH/SCP 環境不支援遠端雜湊比對
        rclone copy "$GITHUB_WORKSPACE/x-wrt/tmp_upload/" "myrouter:/mnt/data/tmp_upload/" \
          --transfers 4 \
          --checkers 8 \
          --sftp-disable-hashcheck \
          -v
        
        if [ $? -eq 0 ]; then
          echo "====== 檔案上傳成功！ ======"
        else
          echo "====== [錯誤] 檔案上傳失敗，請檢查網路、rclone 設定或密鑰權限 ======"
          exit 1
        fi
        EOF
        
        chmod +x upload_to_router.sh
        ./upload_to_router.sh


    - name: 上传固件到github
      uses: actions/upload-artifact@master
      with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
          path: x-wrt/bin

    - name: SSH connection for failure Debug
      if: ${{ failure() }}
      #uses: P3TERX/ssh2actions@main
      uses: owenthereal/action-upterm@v1

        #with:
        #name: OpenWrt_firmware
        #path: ./bin/targets/

    - name: Upload bin directory if failure
      uses: actions/upload-artifact@master
      if:  failure()
      with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
           #OpenWrt_bin_${{ env.ROUTER_MODEL }}_failure
          path: x-wrt/bin

        #with:
        #name: OpenWrt_firmware
        #path: ./bin/targets/

    - name: Upload release asset
      if: github.event == 'release'
      uses: svenstaro/upload-release-action@v2
      with:
          repo_token: ${{ secrets.YOURTOKEN }}
          file: ./artifact/firmware/*
          tag: ${{ github.ref }}
          file_glob: true


    - name: Send repository_dispatch
      env:
          PAT: ${{ secrets.GITHUB_TOKEN }}
      run: |
          curl \
          -X POST \
          -H "Authorization: token $PAT" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/henrylwc11/openwrt_build/dispatches \
          -d '{"event_type":"ramips_completed"}'



