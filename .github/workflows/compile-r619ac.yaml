name: Compile R619AC3 TVH x-wrt Images  

on:
 #repository_dispatch:
    #types: [ipq40xx_completed]
 workflow_dispatch:    
    inputs:
      ssh:
        description: '啟動 SSH 除錯模式？(輸入 true 啟動)'
        required: false
        default: 'false'
  #push:
   #branches: 
    #- master
 #schedule:
  #  - cron: "45 15 * * *"
  #release:
   # types: [published]
  #watch:
    #types: started

  #workflow_dispatch:    
    
env:
  #####change model here ####@# 
  ROUTER_MODEL: r619ac
  TVH: true
  CONFIG_FILENAME_FOR_2ND_COMPILE: config.r619ac
  BUILD_KERNEL_MODULES: true
  DRIVERS_DIR: x-wrt/bin/targets/ipq40xx/drivers
  KERNEL_CONFIG: 'myconfig/kernel_config.r619ac'
  KERNEL_CONFIG_DIR: x-wrt/target/linux/ipq40xx
  #KERNEL_CONFIG_DIR: target/linux/ramips/mt7620
  #KERNEL_CONFIG_DIR: target/linux/ramips/mt7621
  #KERNEL_CONFIG_DIR: target/linux/mvebu
  MAKEMENU_CONFIG: false
  KERNEL_MENUCONFIG: false
  CPU_MULTI_CORE: true
  #KERNEL_VERSION: '5.15'
  KERNEL_VERSION: '6.18'                                                                            
  UPDATE_MULTI_CORE_FILE1: myconfig/sys.lua
  UPDATE_MULTI_CORE_FILE2: myconfig/processes.js
  KERNEL_MODULE: myconfig/kernel_r619ac
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  SSH_ACTIONS: true
  UPLOAD_FIRMWARE: true
  #UPLOAD_ROUTER: true
  TZ: Asia/Shanghai
  CLEARCACHE: true
  PASS: ${{ secrets.PASS }}           # 讀取你的認證密碼 (例如 admin:password)
  SERVER1: ${{ vars.SERVER1 }}        # 讀取主要伺服器名稱
  SERVER2: ${{ vars.SERVER2 }}        # 讀取備用伺服器名稱
  
jobs:

  build_openwrt:
    ###@####
    name: Build R619AC x-wrt TVH firmware
    #runs-on: ubuntu-latest
    #continue-on-error: true 
    runs-on: ubuntu-22.04
    #if: github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: 检查项目分支
        uses: actions/checkout@main
        
      - name: Check CPU model
        run: |                                                    
          cat /proc/cpuinfo|grep model                            
          cat /proc/cpuinfo|grep proc
          echo cpu core=$(nproc)
          free
      - name: 更改设置
        run: |
          #cat /proc/cpuinfo|grep model
          #cat /proc/cpuinfo|grep proce
          chmod +x $GITHUB_WORKSPACE/$DIY_P1_SH
          $GITHUB_WORKSPACE/$DIY_P1_SH
          chmod +x $GITHUB_WORKSPACE/$DIY_P2_SH
          $GITHUB_WORKSPACE/$DIY_P2_SH
          sudo timedatectl set-timezone "$TZ"
      - name: Generate cache mixkey
        id: gen_cache_mixkey
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          target_device_arch_1="ipq40xx"
          #target_device_arch_1="mvebu_ipq40xx_ramips"
          #target_device_arch_1="mvebu"
          gcc_hash=$(gcc --version | sha256sum | awk '{print substr($1,1,8)}')
          #gcc_hash='37dab1b7'       
          ldd_hash=$(ldd --version | sha256sum | awk '{print substr($1,1,8)}')
          mixkey1="${target_device_arch_1}-${gcc_hash}-${ldd_hash}"
          #mixkey2="${target_device_arch_2}-${gcc_hash}-${ldd_hash}"
          echo "mixkey1=$mixkey1" >> $GITHUB_OUTPUT
     
      - name: Cache1
        uses: HiGarfield/cachewrtbuild@main 				#klever1988/cachewrtbuild@main 
        with:
          ccache: 'true'
          mixkey: ${{ steps.gen_cache_mixkey.outputs.mixkey1 }}
          #prefix: ${{ env.WORKING_DIR }}
          prefix: ${{ github.workspace }}/x-wrt
          #skip_saving: 'true'
      - name: Clear Cache
        if: env.CLEARCACHE == 'true'
        run: |
          gh extension install actions/gh-actions-cache
          REPO=${{ github.repository }}
          BRANCH="master"
          #target_device_arch_1="ipq40xx" 
          #echo "Fetching list of cache key"
          list_of_caches=$(gh actions-cache  --sort created-at list -R $REPO -B $BRANCH -L 100| cut -f 1)
          echo $list_of_caches
          no_of_cache=$(gh actions-cache list -R $REPO -B $BRANCH -L 100|wc -l)
          echo no of cache found = $no_of_cache
          if [ "$no_of_cache" -gt 6 ]
          then
          cacheKey=$(gh actions-cache  --sort created-at list -R $REPO -B $BRANCH -L 100| cut -f 1|tail -1 )
          ## Setting this to not fail the workflow while deleting cache keys.
          set +e
          echo "Deleting caches..."
          gh actions-cache delete $cacheKey -R $REPO -B $BRANCH --confirm
          echo $cacheKey
          echo "Done"
          fi
          size=`du x-wrt/staging_dir/|tail -1|awk '{print $1}'`
          if [ $size -ge 100000 ] 
          then 
            config_file="x-wrt/config.$ROUTER_MODEL.3"
            echo caches restored using config file $config_file
            echo "CACHE_RESTORED=TRUE" >> $GITHUB_ENV            
            echo "bin=bin2" >> $GITHUB_ENV
          else
            config_file="x-wrt/config.$ROUTER_MODEL.0"
            echo caches not found,using config file $config_file
            echo "CACHE_RESTORED=FALSE" >> $GITHUB_ENV   
            echo "bin=bin1" >> $GITHUB_ENV
          fi
          cp $config_file myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE                
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装编译环境
        env:
          SSH_ACTIONS: true
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt list --installed
          #/usr/bin/tar -xf /home/runner/work/_temp/1a144490-77f9-4c00-ae54-698cee23f6b0/cache.tgz -P -C $GITHUB_WORKSPACE -z
          #ls -alt ${{ github.workspace }}/x-wrt/staging_dir/*
          #docker rmi `docker images -q`
          #sudo apt remove firefox powershell microsoft-edge* temurin* php* nginx dotnet* ubuntu-gnome-desktop gnome-shell golang* google* mysql* ruby* apach* r-*
          
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-get -y rsync rclone purge azure-cli ghc* zulu* hhvm llvm* firefox google* dotnet* powershell openjdk* adoptopenjdk* mysql* php* mongodb* dotnet* moby* snapd* || true
          sudo -E apt-get update
          sudo -E apt-get -y install opencc ccache build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libfuse-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5
          #sudo -E apt-get update
          #sudo -E apt-get -y install build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libfuse-dev libz-dev patch python3 unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler antlr3 gperf swig libtinfo5 --fix-missing
          sudo apt-get purge --auto-remove azure* openjdk* firefox* powershell* microsoft-edge* temurin* r-* php* nginx dotnet* ubuntu-gnome-desktop gnome-shell golang* google* mysql* ruby* apach*
          pip install asciidoc 
          sudo -E apt-get -y autoremove --purge
          #sudo pip install ply 
          #sudo -E python3 -m pip install --upgrade pip 
          #sudo -E pip install --no-cache-dir --trusted-host pypi.org --trusted-host pypi.python.org --trusted-host files.pythonhosted.org pip setuptools
          sudo -E apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get autoremove
          sudo apt-get autoclean -y 
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo rm -rf /usr/local/lib/android
          sudo apt-get autoremove
          sudo apt-get autoclean -y 
          sudo rm -f /usr/local/share/chromium/chrome-linux/chrome
          sudo rm -f /opt/microsoft/msedge/msedge
          sudo rm -f $GITHUB_WORKSPACE/lede/.git/objects/pack/pack-*.pack
          df -kh
          #find /home/runner/work/_temp/ -name "*cache*"
     # - name: Run migrations
      #  run: sh ./github/scripts/migrate.sh
       # env:
        # ENVIRONMENT_VARIABLE_NAME: ${{ secrets.ENVIRONMENT_VARIABLE_NAME }}
          # echo 'HELLO_WORLD='${{ secrets.HELLO_WORLD }} >> .env // Code line 1
    
    #
      #- name: Generate configuration file
       #  run: |
         
          #rm -f ./.config*
          #touch ./.config

          #
          # 在 cat >> .config <<EOF 到 EOF 之间粘贴你的编译配置, 需注意缩进关系
          # 例如:

          #cat >> .config <<EOF
          #CONFIG_TARGET_IMAGES_GZIP=y
          #CONFIG_KERNEL_BUILD_USER="OpenWrt-CI"
          #CONFIG_KERNEL_BUILD_DOMAIN="Azure"
          #EOF

          #
          # ===============================================================
          # 

       #   sed -i 's/^[ \t]*//g' ./.config
        #  make defconfig
      - name: 清理空间(Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
          tool-cache: false
        
        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: 下载安装包
        run: |
          cd x-wrt 
          make download -j8 || make download -j1 V=s
          rm -rf $(find ./dl/ -size -1024c)
          df -h
          #git reset --hard 639419e
          #git revert 1a9ee367343edce263f82cc91a49d796c9d45ea3
          #git revert 41e1e838fbbb0308ad7353a3714e04b8c4585e7e
      - name: Install SSH Key for Router
        run: |
          mkdir -p $GITHUB_WORKSPACE/x-wrt/tmp_upload
          mkdir -p ~/.ssh
          # 從 GitHub Secrets 讀入私鑰並寫入檔案
          echo "${{ secrets.ROUTER_SSH_KEY }}" > ~/.ssh/router_key
          chmod 600 ~/.ssh/router_key
          
          # 掃描並信任遠端路由器的主機指紋（預設埠 422），防止 SSH 互動式確認卡死
          ssh-keyscan -p ${{ secrets.ROUTER_PORT }} ${{ secrets.SERVER1 }} >> ~/.ssh/known_hosts 2>/dev/null || true
           
      - name: 1. 在背景啟動 Upterm SSH 通道
        id: upterm_ssh
        uses: owenthereal/action-upterm@v1
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        with:
          detached: true

      - name: 2. 擷取日誌連線資訊並發送 Telegram，然後卡住等待
        if: github.event.inputs.ssh == 'true' || contains(github.event.action, 'ssh')
        run: |
          # 1. 緩衝 8 秒，給背景的 Upterm 足夠的時間完成網域配置
          sleep 8
          
          # 2. 自動為觸發者授權 GitHub 帳號裡的 SSH Key 憑證 (已修正漏掉的斜線)
          mkdir -p ~/.ssh
          curl -s "https://github.com{{ github.actor }}.keys" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # 3. 從 Upterm 產生的系統日誌中抓取唯一的 SSH 連線網址
          SSH_CMD=$(grep -oE "ssh://[^ ]+" /home/runner/.upterm.log | head -n 1 || echo "")
          
          if [ -z "$SSH_CMD" ]; then
            SSH_CMD=$(grep -oE "ssh://[^ ]+" ~/.upterm.log | head -n 1 || echo "")
          fi
          
          if [ -z "$SSH_CMD" ]; then
            SSH_CMD="未能從日誌中即時擷取到網址，請至 GitHub Actions 的 Live Log 內手動查看。"
          fi
          
          # 4. 組裝推送到 Telegram 的訊息 (處理 Markdown 特殊字元避免 Telegram 報錯)
          # 把底線、小數點等特殊字元加上反斜線轉義
          SSH_CMD_ESC=$(echo "$SSH_CMD" | sed 's/_/\\_/g; s/\./\\./g; s/-/\\-/g')
          MSG="🚀 *GitHub Actions 偵錯連線已啟動* %0A%0A 📋 *連線指令：* %0A \`$SSH_CMD_ESC\`"
          
          # 5. 秒發送到 Telegram (👉 已修正為正確的 api.telegram.org/bot 網址)
          curl -s -X POST "https://telegram.org{{ env.TELEGRAM_TOKEN }}/sendMessage" \
            -d "chat_id=${{ env.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=MarkdownV2" \
            -d "text=$MSG"
            
          echo "============================================="
          echo "Telegram 通知已發送！抓取到的指令為: $SSH_CMD"
          echo "當你偵錯完畢想讓 Workflow 繼續往下跑時，請在連線的終端機執行："
          echo "touch continue"
          echo "============================================="
          
          # 6. 在這個步驟真正卡住 Runner，開始等你的 SSH 連線
          while [ ! -f continue ]; do
            sleep 10
          done
          echo "偵錯完成，工作流繼續執行後續步驟。"
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
   
           
      - name: 开始编译固件
        run: |
          #cp patches/110-mtd-limit-OTP-nvmem-to-non-nand-devices.patch x-wrt/target/linux/ipq40xx/patches-6.6/ 
          cd x-wrt
          #sed -i 's/CONFIG_PACKAGE_node=m/#CONFIG_PACKAGE_node=m/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
          #sed -i 's/CONFIG_NODEJS_ICU_SMALL=y/#CONFIG_NODEJS_ICU_SMALL=y/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
          #sed -i 's/CONFIG_PACKAGE_node-npm=m/#CONFIG_PACKAGE_node-npm=m/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
          [ -d "build_dir" ] && sudo mv build_dir /mnt/ || ( mkdir build_dir;sudo mv build_dir /mnt/ )
          ln -s /mnt/build_dir .
          sudo mv dl /mnt/
          ln -s /mnt/dl .
          [ -d "bin" ] && sudo mv bin /mnt/ || ( mkdir bin;sudo mv bin /mnt/ )
          ln -s /mnt/bin .
          sudo ln -s  /home/runner/work/Actions-OpenWrt/Actions-OpenWrt/x-wrt/staging_dir/ /mnt/ 
          # rm dl/rrdtool*
          #wget https://oss.oetiker.ch/rrdtool/pub/archive/rrdtool-1.0.x/rrdtool-1.0.50.tar.gz
          #wget https://lftp.yar.ru/ftp/lftp-4.9.2.tar.xz
          #cd ../
          #echo cpu core=$(nproc)
          #cp config.r619ac.0 .config 
          #make -j$(nproc) || make -j1 V=s
          #[ $? != 0 ] && make V=s || echo "build success"
          df -kh
          #rm `find $GITHUB_WORKSPACE/x-wrt/build_dir/ -name *.o`
          #du -a / | sort -n -r | head -n 20>/tmp/largefiles.txt
          #cat /tmp/largefiles.txt
          
          df -kh
          #make V=99 2>&1 |tee build.log
          #     echo "======================="
          #echo "Space usage:"
          #echo "======================="
          df -kh
          #echo "======================="
          #du -h ./ --max-depth=1
          #du -h ~/work/x-wrt --max-depth=1 || true
          #sudo find build_dir/ -name *.o -exec rm {} + 
      
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
         uses: owenthereal/action-upterm@v1 
         #uses: owenthereal/action-upterm@v1
         #uses: owenthereal/action-upterm@v1
         env:
           TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
           TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
      
      - name: SSH connection for KERNEL MENU CONFIG
        if: env.KERNEL_MENUCONFIG == 'true'
          # uses: owenthereal/action-upterm@v1
        uses: owenthereal/action-upterm@v1
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
 
      - name: 再次编译固件 after updated kernel_menuconfig 
        env: 
           PASS: ${{ secrets.FILEUPLOAD }}
        if: env.BUILD_KERNEL_MODULES == 'true'
        run: |
         
           mkdir -p $DRIVERS_DIR

           cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config
           #cp myconfig/config.r619ac. x-wrt/.config     
           sed -i 's/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU is not set/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU=y/g' x-wrt/.config
           sed -i 's/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS is not set/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS=y/g' x-wrt/.config
           [ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           cd x-wrt

           sudo rm -rf /usr/share/dotnet
           sudo rm -rf /opt/ghc
           sudo rm -rf "/usr/local/share/boost"
           sudo rm -rf "$AGENT_TOOLSDIRECTORY"
           #sudo rm -rf $GITHUB_WORKSPACE/lede
           echo cpu core=$(nproc)
           make -j$(nproc)
           cd ../
           cp -f x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox $DRIVERS_DIR/busybox.$ROUTER_MODEL
           chmod 755 $DRIVERS_DIR/busybox.$ROUTER_MODEL

           sed -i 's/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU=y/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU is not set/g' x-wrt/.config
           sed -i 's/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS=y/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS is not set/g' x-wrt/.config
           #cp myconfig/config.r619ac.3  x-wrt/.config 
           cd x-wrt
           make -j$(nproc)
           df -kh
           [ $? != 0 ] && make V=s || echo "build success"
           cp -f bin/targets/ipq40xx/generic/openwrt-ipq40xx-generic-p2w_r619ac-128m-squashfs-sysupgrade.bin bin/targets/ipq40xx/drivers/  
           df -kh
      - name: SSH connection for failure Debug
        if: ${{ failure() }}
        uses: owenthereal/action-upterm@v1
        #uses: owenthereal/action-upterm@v1
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
      - name: Prepare artifact
        run: |
          # 1. 確保資料夾存在（如果變數沒設定，預設建立在當前目錄的 drivers）
          : "${DRIVERS_DIR:=./drivers}"
          mkdir -p "$DRIVERS_DIR"
        
          # 2. 安全地尋找並複製驅動程式
          echo "=== 正在尋找 .ko 檔案 ==="
            mkdir -p $DRIVERS_DIR

            cat << 'EOF' > copy_all_drivers.sh
            #!/bin/sh
            echo "=== 正在尋找所有核心目錄下的 .ko 檔案 ==="
            
            # 使用你廣義的核心路徑，並排除 oot 驅動
            KO_FILES=$(find x-wrt/build_dir/target*/linux*/linux-*/ -name "*.ko" | grep -v oot || true)
            
            if [ -n "$KO_FILES" ]; then
                echo "$KO_FILES" | while read -r src_file; do
                    if [ -f "$src_file" ]; then
                        filename=$(basename "$src_file")
                        dest_file="$DRIVERS_DIR/$filename"
                        
                        # 保留 -f 精神：若有同名檔案（即使是剛產生的），先刪除再重新複製
                        # 這樣既能達到強制覆蓋最新驅動的效果，又絕不會引發 cp 衝突報錯
                        if [ -f "$dest_file" ]; then
                            rm -f "$dest_file"
                        fi
                        
                        cp "$src_file" "$dest_file"
                    fi
                done
                echo "成功複製所有核心驅動程式。"
            else
                echo "警告：在此廣義路徑下找不到任何 .ko 驅動程式檔案。"
            fi
            EOF
            chmod +x copy_all_drivers.sh
            ./copy_all_drivers.sh
          cp -f `find x-wrt/bin/ -name kmod*.ipk` $KMOD_DIR 
          cp -f `find x-wrt/bin/ -name tvheadend*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *libdvbcsa*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *curl*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *ffmpeg*.ipk` $DRIVERS_DIR

          # 3. 獲取韌體編譯版本號
          echo "=== 正在獲取 BUILD_VERSION ==="
          VERSION_FILE=$(find x-wrt/bin/targets/ -name version.buildinfo | head -1 || true)
          if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            head -1 "$VERSION_FILE" > BUILD_VERSION
            echo "BUILD_VERSION=_$(cat BUILD_VERSION)" >> $GITHUB_ENV
          else
            echo "找不到 version.buildinfo，跳過設定。"
          fi
          # 4. 獲取裝置型號名稱
          echo "=== 正在獲取 DEVICE_NAME ==="
          if [ -f x-wrt/.config ]; then
            grep '^CONFIG_TARGET.*DEVICE.*=y' x-wrt/.config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
            if [ -s DEVICE_NAME ]; then
              echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
            fi
          else
            echo "找不到 .config 檔案，跳過設定。"
          fi
          # 5. 記錄編譯時間
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          #  6. 獲取 Linux 核心版本號
          echo "=== 正在獲取 KERNEL_VER ==="
          KMOD_FILE=$(find x-wrt/bin/targets -name "*kmod*" | tail -1 || true)
          if [ -n "$KMOD_FILE" ]; then
            echo "$KMOD_FILE" | cut -d _ -f2 | cut -d - -f1 > KRNEL_VER
            if [ -s KRNEL_VER ]; then
              echo "KERNEL_VER=_$(cat KRNEL_VER)" >> $GITHUB_ENV
            fi
          else
            echo "找不到包含 kmod 的檔案，跳過設定。"
          fi
        
          echo "=== 準備程序結束 ==="
      - name: zip bin directory upload firmware to router/github
        run: |
          if: env.CACHE_RESTORED = 'TRUE'
          zip -r x-wrt/OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip x-wrt/bin
          copy_file.sh x-wrt/OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip
          uses: actions/upload-artifact@master
          with:
            name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
            path: x-wrt/bin
