      - name: 清理空间(Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
          tool-cache: false

      - name: 下载安装包
        run: |
          cd x-wrt 
          make download -j8 || make download -j1 V=s
          rm -rf $(find ./dl/ -size -1024c)
          df -h
      - name: Install SSH Key for Router
        run: |
          mkdir -p $GITHUB_WORKSPACE/x-wrt/tmp_upload
          mkdir -p ~/.ssh
          # 從 GitHub Secrets 讀入私鑰並寫入檔案
          echo "${{ secrets.ROUTER_SSH_KEY }}" > ~/.ssh/router_key
          chmod 600 ~/.ssh/router_key
          
          # 掃描並信任遠端路由器的主機指紋（預設埠 422），防止 SSH 互動式確認卡死
          ssh-keyscan -p ${{ secrets.ROUTER_PORT }} ${{ secrets.SERVER1 }} >> ~/.ssh/known_hosts 2>/dev/null || true
           

      - name: 1. 在背景啟動 Upterm SSH 通道
        id: upterm_ssh
        #uses: owenthereal/action-upterm@v1
        uses: owenthereal/action-upterm@v1
        #uses: P3TERX/ssh2actions@main
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
            
      - name: SSH connection for make menuconfig    
        if: env.MAKEMENU_CONFIG == 'true'
        uses: owenthereal/action-upterm@v1
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    

         
      - name: 开始编译固件
        run: |
          #[ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
          cd x-wrt
          rm -r feeds/packages/utils/dockerd
          [ -d "build_dir" ] && sudo mv build_dir /mnt/ || ( mkdir build_dir;sudo mv build_dir /mnt/ )
          ln -s /mnt/build_dir .
          sudo mv dl /mnt/
          ln -s /mnt/dl .
          [ -d "bin" ] && sudo mv bin /mnt/ || ( mkdir bin;sudo mv bin /mnt/ )
          ln -s /mnt/bin .
          sudo ln -s  /home/runner/work/Actions-OpenWrt/Actions-OpenWrt/x-wrt/staging_dir/ /mnt/ 
          #cp config.newifi-d2.2 .config
          #make -j$(nproc) || make -j1 V=s
          #make kernel_menuconfig
          #sleep 3600
          #cd ../
          #[ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
          #[ $? != 0 ] && make V=s || echo "zteq7 build success"
          #cp config.$ROUTER_MODEL.0 .config
          #echo cpu core=$(nproc)
          #make -j$(nproc) || make -j1 V=s
          #[ $? != 0 ] && make V=s || echo "zteq7 build success"
          #cp -f bin/targets/ramips/mt7620/openwrt-ramips-*squashfs-sysupgrade.bin bin/targets/ramips/drivers/
          #mv bin/targets bin/targets_mt7620
          #mv bin/packages bin/packages_mt7620
         
          #     echo "======================="
          #echo "Space usage:"
          #echo "======================="
          #df -h
          #echo "======================="
          #du -h ./ --max-depth=1
          #du -h ~/work/x-wrt --max-depth=1 || true

      
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
         uses: owenthereal/action-upterm@v1
         #uses: P3TERX/ssh2actions@main
         env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    

      - name: SSH connection for KERNEL MENU CONFIG
        if: env.KERNEL_MENUCONFIG == 'true'
        uses: owenthereal/action-upterm@v1
        #uses: P3TERX/ssh2actions@main
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    

 
      - name: 再次编译固件 after updated kernel_menuconfig
        env:
          PASS: ${{ secrets.FILEUPLOAD }}
        if: env.BUILD_KERNEL_MODULES == 'true'
        run: |
           
           
           mkdir -p $DRIVERS_DIR

           #cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config
           cp myconfig/config.newifi-d2.2 x-wrt/.config                                                                                         
           sed -i 's/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU is not set/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU=y/g' x-wrt/.config
           sed -i 's/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS is not set/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS=y/g' x-wrt/.config                    
           [ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           cd x-wrt 
           
           sudo rm -rf /usr/share/dotnet
           sudo rm -rf /opt/ghc
           sudo rm -rf "/usr/local/share/boost"
           sudo rm -rf "$AGENT_TOOLSDIRECTORY" 
           #sudo rm -rf $GITHUB_WORKSPACE/lede
           echo cpu core=$(nproc)
           make -j$(nproc) 
           cd ../ 
           cp -f x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox $DRIVERS_DIR/busybox.$ROUTER_MODEL
           chmod 755 $DRIVERS_DIR/busybox.$ROUTER_MODEL
           
           sed -i 's/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU=y/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_CPU is not set/g' x-wrt/.config
           sed -i 's/CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS=y/# CONFIG_BUSYBOX_CONFIG_FEATURE_TOP_SMP_PROCESS is not set/g' x-wrt/.config
           #cp myconfig/config.newifi-d2.2 x-wrt/.config
           cd x-wrt
           make -j$(nproc)
           df -kh
           [ $? != 0 ] && make V=s || echo "build success" 
           cp -f bin/targets/ramips/mt7621/openwrt-ramips-mt7621-d-team_newifi-d2-squashfs-sysupgrade.bin bin/targets/ramips/drivers/ 
      - name: SSH connection for failure Debug
        if: ${{ failure() }}
        uses: owenthereal/action-upterm@v1
        #uses: P3TERX/ssh2actions@main
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
      - name: Prepare artifact
        run: |
          # 1. 確保資料夾存在（如果變數沒設定，預設建立在當前目錄的 drivers）
          : "${DRIVERS_DIR:=./drivers}"
          mkdir -p "$DRIVERS_DIR"
        
          # 2. 安全地尋找並複製驅動程式
            mkdir -p $DRIVERS_DIR

            cat << 'EOF' > copy_drivers.sh
            #!/bin/sh
            echo "=== 正在尋找特定平台的 .ko 檔案 ==="
            
            # 精確比對你原廠路徑下的 .ko 檔案並排除 oot
            KO_FILES=$(find x-wrt/build_dir/target*/linux*7621*/linux-*/ -name "*.ko" | grep -v oot || true)
            
            if [ -n "$KO_FILES" ]; then
                echo "$KO_FILES" | while read -r src_file; do
                    if [ -f "$src_file" ]; then
                        filename=$(basename "$src_file")
                        dest_file="$DRIVERS_DIR/$filename"
                        
                        # 採用你原本 -f (force) 的精神：如果同名檔案已存在，先刪除舊的再複製，完美避開 cp 覆寫保護錯誤
                        if [ -f "$dest_file" ]; then
                            rm -f "$dest_file"
                        fi
                        
                        cp "$src_file" "$dest_file"
                    fi
                done
                echo "成功複製所有平台驅動程式。"
            else
                echo "警告：在此路徑下找不到任何 .ko 驅動程式檔案。"
            fi
            EOF
            chmod +x copy_drivers.sh
            ./copy_drivers.sh
          cp -f `find x-wrt/bin/ -name kmod*.ipk` $KMOD_DIR 
          cp -f `find x-wrt/bin/ -name tvheadend*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *libdvbcsa*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *curl*.ipk` $DRIVERS_DIR
          cp -f `find x-wrt/bin/ -name *ffmpeg*.ipk` $DRIVERS_DIR
          # 3. 獲取韌體編譯版本號
          echo "=== 正在獲取 BUILD_VERSION ==="
          VERSION_FILE=$(find x-wrt/bin/targets/ -name version.buildinfo | head -1 || true)
          if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            head -1 "$VERSION_FILE" > BUILD_VERSION
            echo "BUILD_VERSION=_$(cat BUILD_VERSION)" >> $GITHUB_ENV
          else
            echo "找不到 version.buildinfo，跳過設定。"
          fi
          # 4. 獲取裝置型號名稱
          echo "=== 正在獲取 DEVICE_NAME ==="
          if [ -f x-wrt/.config ]; then
            grep '^CONFIG_TARGET.*DEVICE.*=y' x-wrt/.config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
            if [ -s DEVICE_NAME ]; then
              echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
            fi
          else
            echo "找不到 .config 檔案，跳過設定。"
          fi
          # 5. 記錄編譯時間
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          #  6. 獲取 Linux 核心版本號
          echo "=== 正在獲取 KERNEL_VER ==="
          KMOD_FILE=$(find x-wrt/bin/targets -name "*kmod*" | tail -1 || true)
          if [ -n "$KMOD_FILE" ]; then
            echo "$KMOD_FILE" | cut -d _ -f2 | cut -d - -f1 > KRNEL_VER
            if [ -s KRNEL_VER ]; then
              echo "KERNEL_VER=_$(cat KRNEL_VER)" >> $GITHUB_ENV
            fi
          else
            echo "找不到包含 kmod 的檔案，跳過設定。"
          fi
        
          echo "=== 準備程序結束 ==="
      - name: zip bin directory upload firmware to router
        if: env.CACHE_RESTORED == 'true'
        env:
          PASS: ${{ secrets.PASS }}
          SERVER1: ${{ vars.SERVER1 }}
          SERVER2: ${{ vars.SERVER2 }}
          PORT: ${{ vars.ROUTER_PORT }}
        run: |
          set -euo pipefail
          ZIP_NAME="x-wrt/OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.BUILD_VERSION }}_${{ env.FILE_DATE }}_${{ env.KERNEL_VER }}.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" x-wrt/bin
          bash x-wrt/copy_file.sh "$ZIP_NAME"
      - name: SSH connection for failure Debug
        if: ${{ failure() }}
        uses: owenthereal/action-upterm@v1
        #uses: P3TERX/ssh2actions@main
        env:
       
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
 
      - name: Upload bin directory if failure
        uses: actions/upload-artifact@master
        if:  failure() 
        with:
          name: OpenWrt_${{env.bin}}_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
           #OpenWrt_${{env.bin}}${{ env.ROUTER_MODEL }}_failure
          path: x-wrt/bin


            #- name: Deliver buildinfo
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_buildinfo
            #path: ./artifact/buildinfo/

            
            #- name: Deliver package
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_package
            #path: ./artifact/package/

            #- name: Deliver firmware
            #uses: actions/upload-artifact@v2
        #with:
        #name: OpenWrt_firmware
        #path: ./bin/targets/

      - name: Upload bin directory if failure
        uses: actions/upload-artifact@master
        if:  failure() 
        with:
          name: OpenWrt_${{env.bin}}_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
           #OpenWrt_${{env.bin}}${{ env.ROUTER_MODEL }}_failure
          path: x-wrt/bin


            #- name: Deliver buildinfo
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_buildinfo
            #path: ./artifact/buildinfo/

            
            #- name: Deliver package
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_package
            #path: ./artifact/package/

            #- name: Deliver firmware
            #uses: actions/upload-artifact@v2
        #with:
        #name: OpenWrt_firmware
        #path: ./bin/targets/

      - name: Upload release asset
        if: github.event == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.YOURTOKEN }}
          file: ./artifact/firmware/*
          tag: ${{ github.ref }}
          file_glob: true
      - name: Send repository_dispatch
        env:
         PAT: ${{ secrets.GITHUB_TOKEN }} 
        run: |
         curl \
         -X POST \
         -H "Authorization: token $PAT" \
         -H "Accept: application/vnd.github.v3+json" \
         https://api.github.com/repos/henrylwc11/openwrt_build/dispatches \
         -d '{"event_type":"ramips_completed"}' 
     
