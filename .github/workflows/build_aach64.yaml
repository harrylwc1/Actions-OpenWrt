        #  make defconfig

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
          tool-cache: false

      - name: Make download
        run: |
          cd x-wrt 
          make download -j8 || make download -j1 V=s
          rm -rf $(find ./dl/ -size -1024c)
          df -h
          #git reset --hard 639419e
          #git revert 1a9ee367343edce263f82cc91a49d796c9d45ea3
          #git revert 41e1e838fbbb0308ad7353a3714e04b8c4585e7e
      - name: Install SSH Key for Router
        run: |
          mkdir -p $GITHUB_WORKSPACE/x-wrt/tmp_upload
          mkdir -p ~/.ssh
          # 從 GitHub Secrets 讀入私鑰並寫入檔案
          echo "${{ secrets.ROUTER_SSH_KEY }}" > ~/.ssh/router_key
          chmod 600 ~/.ssh/router_key
          
          # 掃描並信任遠端路由器的主機指紋（預設埠 422），防止 SSH 互動式確認卡死
          ssh-keyscan -p ${{ secrets.ROUTER_PORT }} ${{ secrets.SERVER1 }} >> ~/.ssh/known_hosts 2>/dev/null || true
           
      - name: SSH链接管理
        uses: P3TERX/ssh2actions@v1.0.0
        if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
        env:
        
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     
           
      - name: Compile firmware
        run: |
          mkdir -p $KMOD_DIR
          mkdir -p $DRIVERS_DIR
          #cp patches/Makefile.golang x-wrt/feeds/packages/lang/golang/golang/Makefile
          #rm x-wrt/feeds/packages/lang/golang/golang/patches/001* 
          cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config
          [ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
 
          cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config 
          cp patches/kernel_ver.patch x-wrt/ 
          
          cd x-wrt
          echo 952ab6bf7329ff5b9354b27b7c5e31d0>./vermagic
          git apply --ignore-space-change --ignore-whitespace kernel_ver.patch
          #rm package/firmware/wireless-regdb/patches/*
          #sed -i 's/CONFIG_PACKAGE_node=m/#CONFIG_PACKAGE_node=m/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
          #sed -i 's/CONFIG_NODEJS_ICU_SMALL=y/#CONFIG_NODEJS_ICU_SMALL=y/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
          #sed -i 's/CONFIG_PACKAGE_node-npm=m/#CONFIG_PACKAGE_node-npm=m/g' $GITHUB_WORKSPACE/myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE
 
          [ -d "build_dir" ] && sudo mv build_dir /mnt/ || ( mkdir build_dir;sudo mv build_dir /mnt/ )
          ln -s /mnt/build_dir .
          sudo mv dl /mnt/
          ln -s /mnt/dl .
          [ -d "bin" ] && sudo mv bin /mnt/ || ( mkdir bin;sudo mv bin /mnt/ )
          ln -s /mnt/bin .
          echo cpu core=$(nproc)
          
          #make -j$(nproc) || make -j1 V=s
          #[ $? != 0 ] && make V=s || echo "build success"
          
          
      
      -  name: SSH connection for failure Debug
         if: ${{ failure() }}
           #uses: lhotari/action-upterm@v1
         uses: P3TERX/ssh2actions@main
         env:
           TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
           TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
      - name: SSH connection for KERNEL MENU CONFIG
        if: env.KERNEL_MENUCONFIG == 'true'
          # uses: lhotari/action-upterm@v1
        uses: P3TERX/ssh2actions@main
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
 
      - name: Compile again after .config updated or add kernel modules
        env:
          PASS: ${{ secrets.FILEUPLOAD }}
        if: env.BUILD_KERNEL_MODULES == 'true'
        run: |
           cp myconfig/$CONFIG_FILENAME_FOR_2ND_COMPILE x-wrt/.config
           [ -e $KERNEL_CONFIG ] && cp -f $KERNEL_CONFIG $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           #sed -i 's/CONFIG_PREEMPT_NONE_BUILD=y/CONFIG_PREEMPT=y/g' $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION
           #[ -e $KERNEL_MODULE ] && cat $KERNEL_MODULE >> $KERNEL_CONFIG_DIR/config-$KERNEL_VERSION 
           cd x-wrt 
           
           sudo rm -rf "$AGENT_TOOLSDIRECTORY"
           echo cpu core=$(nproc)
           make -j$(nproc)
           #|| make -j1 V=s
           #[ $? != 0 ] && make V=s || echo "build success" 
           cd ../ 
           cp -f x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox $DRIVERS_DIR
           chmod 755 $DRIVERS_DIR/busybox
           cp -f x-wrt/build_dir/target-*/busybox-*/busybox-*/ipkg-install/bin/busybox busybox.$ROUTER_MODEL
           copy_file.sh busybox.$ROUTER_MODEL 
           #cp -f bin/targets/mvebu/cortexa9/openwrt-mvebu-cortexa9-linksys_wrt1200ac-squashfs-sysupgrade.bin bin/targets/mvebu/drivers/                                                               
           df -kh
      - name: SSH connection for failure Debug
        if: ${{ failure() }}
        #uses: lhotari/action-upterm@v1
        uses: P3TERX/ssh2actions@main
        env:
      
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
      - name: Prepare artifact
        run: |
          # 1. 確保資料夾存在（如果變數沒設定，預設建立在當前目錄的 drivers）
          : "${DRIVERS_DIR:=./drivers}"
          mkdir -p "$DRIVERS_DIR"
        
          # 2. 安全地尋找並複製驅動程式
          echo "=== 正在尋找 .ko 檔案 ==="
          KO_FILES=$(find x-wrt/build_dir/target* -name "*.ko" | grep -v oot || true)
          if [ -n "$KO_FILES" ]; then
            cp $KO_FILES "$DRIVERS_DIR/"
            echo "成功複製驅動程式。"
          else
            echo "警告：找不到任何 .ko 驅動程式檔案。"
          fi
          # 3. 獲取韌體編譯版本號
          echo "=== 正在獲取 BUILD_VERSION ==="
          VERSION_FILE=$(find x-wrt/bin/targets/ -name version.buildinfo | head -1 || true)
          if [ -n "$VERSION_FILE" ] && [ -f "$VERSION_FILE" ]; then
            head -1 "$VERSION_FILE" > BUILD_VERSION
            echo "BUILD_VERSION=_$(cat BUILD_VERSION)" >> $GITHUB_ENV
          else
            echo "找不到 version.buildinfo，跳過設定。"
          fi
          # 4. 獲取裝置型號名稱
          echo "=== 正在獲取 DEVICE_NAME ==="
          if [ -f x-wrt/.config ]; then
            grep '^CONFIG_TARGET.*DEVICE.*=y' x-wrt/.config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
            if [ -s DEVICE_NAME ]; then
              echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
            fi
          else
            echo "找不到 .config 檔案，跳過設定。"
          fi
          # 5. 記錄編譯時間
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          #  6. 獲取 Linux 核心版本號
          echo "=== 正在獲取 KERNEL_VER ==="
          KMOD_FILE=$(find x-wrt/bin/targets -name "*kmod*" | tail -1 || true)
          if [ -n "$KMOD_FILE" ]; then
            echo "$KMOD_FILE" | cut -d _ -f2 | cut -d - -f1 > KRNEL_VER
            if [ -s KRNEL_VER ]; then
              echo "KERNEL_VER=_$(cat KRNEL_VER)" >> $GITHUB_ENV
            fi
          else
            echo "找不到包含 kmod 的檔案，跳過設定。"
          fi
        
          echo "=== 準備程序結束 ==="
      - name: zip bin directory
        run: |
          cd x-wrt
          zip -r OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip bin
      - name: 上传固件到Router using rsync
        run: |
          sudo apt-get install rsync -y
          cp x-wrt/OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}.zip $GITHUB_WORKSPACE/x-wrt/tmp_upload/
          cat << 'EOF' > upload_to_router.sh
          #!/bin/sh
          echo "====== 開始將 tmp_upload/ 傳輸至 OpenWrt 路由器 ====="
          
          # 定義 SSH 連線參數 (配合舊版 Dropbear 最佳化)
          SSH_OPTS="ssh -i ~/.ssh/router_key -p ${{ secrets.ROUTER_PORT }} -o StrictHostKeyChecking=no -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa"
          
          # 執行 rsync 同步 (將本機 x-wrt/tmp_upload/ 傳到路由器的 /mnt/data/tmp_upload/)
          # 加上 --blocking-io 強迫透過純 SSH 管道傳輸，避免遠端路由器未裝 rsync 協議的錯誤
          rsync -avz --blocking-io -e "${SSH_OPTS}" x-wrt/tmp_upload/ root@${{ secrets.SERVER1 }}:/mnt/data/tmp_upload/
          
          if [ $? -eq 0 ]; then
            echo "====== 檔案上傳成功！ ======"
          else
            echo "====== [錯誤] 檔案上傳失敗，請檢查網路或密鑰設定 ======"
            exit 1
          fi
          EOF
          
          chmod +x upload_to_router.sh
          ./upload_to_router.sh      - name: Upload bin directory
      - name: Upload bin directory        
        uses: actions/upload-artifact@master
        with:
          name: OpenWrt_snapshots_bin${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
           #OpenWrt_bin_${{ env.ROUTER_MODEL }}
          path: x-wrt/bin
      - name: SSH connection for failure Debug
        if: ${{ failure() }}
        uses: P3TERX/ssh2actions@main
        env:
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}    
        ### also try to upload if fixed by ssh to server ####
        
      - name: Upload bin directory if failure
        uses: actions/upload-artifact@master
        if:  failure() 
        with:
          name: OpenWrt_bin_${{ env.DEVICE_NAME }}${{ env.BUILD_VERSION }}${{ env.FILE_DATE }}${{ env.KERNEL_VER}}
           #OpenWrt_bin_${{ env.ROUTER_MODEL }}_failure
          path: x-wrt/bin


            #- name: Deliver buildinfo
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_buildinfo
            #path: ./artifact/buildinfo/

            
            #- name: Deliver package
            #uses: actions/upload-artifact@v2
            #with:
            #name: OpenWrt_package
            #path: ./artifact/package/

            #- name: Deliver firmware
            #uses: actions/upload-artifact@v2
        #with:
        #name: OpenWrt_firmware
        #path: ./bin/targets/

      - name: Upload release asset
        if: github.event == 'release'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.YOURTOKEN }}
          file: ./artifact/firmware/*
          tag: ${{ github.ref }}
          file_glob: true
