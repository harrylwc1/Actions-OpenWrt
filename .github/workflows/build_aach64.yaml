name: Compile aarch64 TVH OpenWrt offical Images  

on:
  #repository_dispatch:
    #types: [mvebu_openwrt_completed]
  workflow_dispatch:    
    inputs:
      ssh:
        description: '啟動 SSH 除錯模式？(輸入 true 啟動)'
        required: false
        default: 'false'
  
  #push:
   #branches: 
    #- master
  #schedule:
